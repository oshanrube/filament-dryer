<svg xmlns="http://www.w3.org/2000/svg" width="760" height="380" viewBox="0 0 760 380" role="img"><title>Heater power steps</title><style>
text{font-family:Inter,Arial,sans-serif}
.t{font-size:18px;font-weight:600;fill:#111}.r{font-size:14px;fill:#111}.v{font-size:12px;fill:#444}.p{font-size:11px;fill:#666}
.bx{fill:#fff;stroke:#111;stroke-width:1.6}.mod{fill:#f4f8ff;stroke:#1565c0;stroke-width:1.6}.safe{fill:#fff4e5;stroke:#ef6c00;stroke-width:1.6}
</style><rect width="760" height="380" fill="#fff"/>
<text class="t" x="30" y="34" text-anchor="start">Heater power near the temperature cap (while the box is too humid)</text>
<path d="M80 300 L700 300" fill="none" stroke="#111" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M80 300 L80 70" fill="none" stroke="#111" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/>
<text class="p" x="70" y="304.0" text-anchor="end">0</text>
<text class="p" x="70" y="194.0" text-anchor="end">50 W</text>
<text class="p" x="70" y="84.0" text-anchor="end">100 W</text>
<text class="p" x="80.0" y="320" text-anchor="middle">cap − 15</text>
<text class="p" x="252.22222222222223" y="320" text-anchor="middle">cap − 10</text>
<text class="p" x="424.44444444444446" y="320" text-anchor="middle">cap − 5</text>
<text class="p" x="596.6666666666667" y="320" text-anchor="middle">cap</text>
<text class="p" x="700.0" y="320" text-anchor="middle">+3</text>
<path d="M80.0 88.80000000000001 L424.44444444444446 88.80000000000001 L424.44444444444446 194.4 L596.6666666666667 194.4 L596.6666666666667 300.0 L700.0 300.0" fill="none" stroke="#c62828" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M80.0 88.80000000000001 L596.6666666666667 88.80000000000001 L596.6666666666667 300.0" fill="none" stroke="#9e9e9e" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<text class="v" x="252.22222222222223" y="78.80000000000001" text-anchor="middle">both halves: 96 W</text>
<text class="v" x="510.55555555555554" y="184.4" text-anchor="middle">half: 48 W</text>
<text class="v" x="604.6666666666667" y="146.0" text-anchor="start">off at the cap</text>
<text class="p" x="338.33333333333337" y="234.0" text-anchor="middle">grey: a single on/off heater</text>
<text class="p" x="30" y="358" text-anchor="start">Each step has 1-2 °C of hysteresis. Halving the power for the last 5 °C roughly halves the overshoot when the heater switches off.</text>
</svg>
