<text class="r" x="200.0" y="402" text-anchor="middle">Or an AHT20 probe (I2C)</text>
<text class="p" x="200.0" y="420" text-anchor="middle">the firmware uses whichever probe answers</text>
<text class="v" x="50" y="450" text-anchor="start">VCC → 3V3,  GND → G</text>
<text class="v" x="50" y="470" text-anchor="start">SDA → D2 (GPIO4),  SCL → D1 (GPIO5)</text>
<text class="v" x="50" y="490" text-anchor="start">R6, R7: 4.7 kΩ from SDA and SCL to 3V3</text>
<text class="v" x="50" y="510" text-anchor="start">(leave R5 and D7 unconnected)</text>
<text class="v" x="50" y="530" text-anchor="start">Not a DHT11: it can't read below 20 % RH or 50 °C.</text>
