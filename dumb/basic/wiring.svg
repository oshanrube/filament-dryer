<text class="t" x="30" y="36" text-anchor="start">Basic dryer controller (Wemos D1 Mini): wiring</text>
<text class="v" x="30" y="58" text-anchor="start">Fan and heater run while the box is above 15 % RH. The heater tapers from full power at 60 °C to off at 65 °C. Crossing wires are not joined unless a dot is shown.</text>
