<text class="v" x="30" y="790" text-anchor="start">Heater: two aluminium-housed 50 W resistors (RX24, 3 Ω) in parallel, 96 W at 12 V (8 A), on one finned heatsink in the blower's airflow. Heater path in 16 AWG silicone wire.</text>
<text class="v" x="30" y="810" text-anchor="start">The KSD301 and thermal fuse sit in the chamber air near the lid: they stop the heater if the probe fails, falls out of the airflow, or the D1 Mini locks up with D5 high.</text>
<text class="v" x="30" y="830" text-anchor="start">At power-up every pin floats: the PC817 stays dark and R3 holds Q1's gate low, so the heater stays off until the firmware has a good reading.</text>
<text class="v" x="30" y="850" text-anchor="start">R1 and R4 are two 1 kΩ in parallel. Grounds marked ⏚ all go to the XT60's black wire; take the heater's ground from Q1's source straight to the XT60, not through the D1 Mini's wiring.</text>
</svg>
