<text class="p" x="530" y="322" text-anchor="middle">slow blink = fan only</text>
<text class="p" x="530" y="338" text-anchor="middle">short flash = dry, idle</text>
<text class="p" x="530" y="354" text-anchor="middle">fast blink = probe fault / too hot</text>
