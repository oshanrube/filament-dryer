; Basic dryer controller: Wemos D1 Mini (ESP8266) + one temperature/humidity probe, fan and heater.
;   pio run -e basic-d1mini              build
;   pio run -e basic-d1mini -t upload    build and flash over USB
;   pio test -e native                   test the control logic on this computer

[platformio]
default_envs = basic-d1mini

[env:basic-d1mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -Wall
lib_deps =
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.14

[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -Wall
