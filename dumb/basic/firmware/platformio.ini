; Basic dryer controller: Wemos D1 Mini or ESP-01S (ESP8266) + one temperature/humidity probe, fan and heater.
;   pio run -e basic-d1mini              build (basic-esp01 for the ESP-01S)
;   pio run -e basic-d1mini -t upload    build and flash over USB
;   pio test -e native                   test the control logic on this computer

[platformio]
default_envs = basic-d1mini

[env:basic-d1mini]
; Wi-Fi reporting (same libraries and versions as the main firmware)
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags = -Wall
lib_deps =
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.14
  https://github.com/tzapu/WiFiManager.git#v2.0.17
  links2004/WebSockets@2.4.1

[env:basic-esp01]
; ESP-01S: 1 MB flash, flashed through a USB ESP-01 adapter with GPIO0 held low
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
monitor_speed = 115200
upload_speed = 115200
build_flags = -Wall -D BOARD_ESP01
lib_deps =
  adafruit/DHT sensor library@1.4.6
  adafruit/Adafruit Unified Sensor@1.1.14

[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -Wall
