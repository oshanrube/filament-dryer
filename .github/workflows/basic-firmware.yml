name: basic-firmware

# The basic D1 Mini controller (dumb/basic/firmware). Tags only, like the main firmware:
# tag basic-v<version>, e.g. basic-v0.1.0.
on:
  push:
    tags: ['basic-v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dumb/basic/firmware
    steps:
      - uses: actions/checkout@v4

      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#basic-v}"
          file=src/main.cpp
          found=$(grep -c '^#define VERSION ' "$file" || true)
          if [ "$found" -ne 1 ]; then
            echo "::error file=dumb/basic/firmware/$file::expected exactly one '#define VERSION' line, found $found"
            exit 1
          fi
          sed -i -E "s|^#define VERSION .*|#define VERSION \"$version\"|" "$file"
          echo "stamped $(grep -n '^#define VERSION ' "$file")"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-basic-${{ runner.os }}-${{ hashFiles('dumb/basic/firmware/platformio.ini') }}
          restore-keys: pio-basic-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Test the control logic
        run: pio test -e native

      # On the ESP8266 firmware.bin already starts with the boot loader: one image, flashed at 0x0.
      - name: Build
        run: |
          pio run -e basic-d1mini
          cp .pio/build/basic-d1mini/firmware.bin basic-dryer-d1mini.bin

      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: basic-dryer-firmware
          path: |
            dumb/basic/firmware/basic-dryer-d1mini.bin
            dumb/basic/firmware/.pio/build/basic-d1mini/firmware.elf
          if-no-files-found: error
          retention-days: 7

      - name: Attach the image to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" basic-dryer-d1mini.bin --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" basic-dryer-d1mini.bin --clobber
