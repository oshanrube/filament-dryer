name: firmware

# Same scheme as the gate controller: tags only (plus manual runs). Every build that leaves here
# is a release build stamped with its tag, so a binary's VERSION is never a guess.
# Tag with fw-v<version>, e.g. fw-v0.1.0.
on:
  push:
    tags: ['fw-v*']
  workflow_dispatch:

permissions:
  contents: write   # needed by the release step

jobs:
  firmware:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware

    steps:
      - uses: actions/checkout@v4

      # The tag is the single source of truth for the version; this overwrites the fallback in
      # the checkout only. A silent no-op would ship firmware reporting the wrong version, so the
      # line count is checked.
      - name: Stamp the version from the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#fw-v}"
          file=src/main.cpp
          found=$(grep -c '^#define VERSION ' "$file" || true)
          if [ "$found" -ne 1 ]; then
            echo "::error file=firmware/$file::expected exactly one '#define VERSION' line, found $found"
            exit 1
          fi
          sed -i -E "s|^#define VERSION .*|#define VERSION \"$version\"|" "$file"
          echo "stamped $(grep -n '^#define VERSION ' "$file")"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      # The control logic (modes, PID, safety cut-outs, scale maths) is tested on the runner
      # before anything is built for the board.
      - name: Test the control logic
        run: pio test -e native

      # dryer-1roll: the 1-roll PCB and its perfboard. dryer-1roll-v2: the twin-scale perfboard.
      - name: Build
        run: pio run -e dryer-1roll -e dryer-1roll-v2

      # <env>.bin is the app only: what /update takes over Wi-Fi. <env>-full.bin adds the
      # bootloader, partition table and boot_app0, and flashes a blank board at 0x0.
      - name: Make the images
        run: |
          pkgs=~/.platformio/packages
          for env in dryer-1roll dryer-1roll-v2; do
            build=.pio/build/$env
            cp "$build/firmware.bin" "$env.bin"
            python "$pkgs/tool-esptoolpy/esptool.py" --chip esp32c3 merge_bin \
              -o "$env-full.bin" \
              --flash_mode keep --flash_freq keep --flash_size 4MB \
              0x0     "$build/bootloader.bin" \
              0x8000  "$build/partitions.bin" \
              0xe000  "$pkgs/framework-arduinoespressif32/tools/partitions/boot_app0.bin" \
              0x10000 "$build/firmware.bin"
          done

      - name: Report flash headroom
        run: |
          limit=1310720           # app0 in default.csv
          for env in dryer-1roll dryer-1roll-v2; do
            size=$(stat -c%s "$env.bin")
            pct=$(( size * 100 / limit ))
            echo "$env: ${size} bytes, ${pct}% of the ${limit} byte app partition"
            if [ "$pct" -ge 90 ]; then
              echo "::warning::$env is at ${pct}% of the app partition."
            fi
          done

      # Manual runs only: a tag's release already carries the images. The .elf is for
      # esp32_exception_decoder and must come from the same build as the running firmware.
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: dryer-firmware
          path: |
            firmware/dryer-1roll*.bin
            firmware/.pio/build/dryer-1roll*/firmware.elf
          if-no-files-found: error
          retention-days: 1

      - name: Attach the images to the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          files="dryer-1roll.bin dryer-1roll-full.bin dryer-1roll-v2.bin dryer-1roll-v2-full.bin"
          gh release create "$GITHUB_REF_NAME" $files --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" $files --clobber
