<svg xmlns="http://www.w3.org/2000/svg" width="990" height="620" viewBox="0 0 990 620" role="img"><title>1-roll v2 front panel</title><style>
text{font-family:Inter,Arial,sans-serif}
.t{font-size:18px;font-weight:600;fill:#111}.r{font-size:14px;fill:#111}.v{font-size:12px;fill:#444}.p{font-size:11px;fill:#666}
.bx{fill:#fff;stroke:#111;stroke-width:1.6}.mod{fill:#f4f8ff;stroke:#1565c0;stroke-width:1.6}.safe{fill:#fff4e5;stroke:#ef6c00;stroke-width:1.6}
</style><rect width="990" height="620" fill="#fff"/>
<text class="t" x="30" y="36" text-anchor="start">1-roll v2: front panel (90 × 70 mm)</text>
<text class="v" x="30" y="58" text-anchor="start">2.8" touch screen module (about 86 × 50 mm). Measure your module before printing: sizes and the screen's offset vary.</text>
<rect x="60" y="90" width="540" height="420" rx="12" fill="#eceff1" stroke="#455a64" stroke-width="2"/>
<rect x="72.0" y="150.0" width="516" height="300" fill="none" stroke="#90a4ae" stroke-dasharray="6 4" stroke-width="1.5"/>
<rect x="153.0" y="165.0" width="354" height="270" fill="#111"/>
<text x="330.0" y="305.0" text-anchor="middle" style="font:14px Inter,Arial,sans-serif;fill:#fff">window 59 × 45 mm</text>
<circle cx="90.0" cy="168.0" r="9.600000000000001" fill="#fff" stroke="#455a64" stroke-width="1.4"/>
<circle cx="570.0" cy="168.0" r="9.600000000000001" fill="#fff" stroke="#455a64" stroke-width="1.4"/>
<circle cx="90.0" cy="432.0" r="9.600000000000001" fill="#fff" stroke="#455a64" stroke-width="1.4"/>
<circle cx="570.0" cy="432.0" r="9.600000000000001" fill="#fff" stroke="#455a64" stroke-width="1.4"/>
<text class="v" x="330.0" y="534" text-anchor="middle">90 mm</text>
<text class="v" x="48" y="300.0" text-anchor="end">70 mm</text>
<text class="v" x="630" y="110" text-anchor="start">Dashed: the screen module behind the</text>
<text class="v" x="630" y="130" text-anchor="start">panel, on M3 screws into printed</text>
<text class="v" x="630" y="150" text-anchor="start">standoffs at its corner holes.</text>
<text class="v" x="630" y="170" text-anchor="start">The module is 86 mm wide: the panel</text>
<text class="v" x="630" y="190" text-anchor="start">needs about 87 mm clear behind it.</text>
<text class="v" x="630" y="210" text-anchor="start"></text>
<text class="v" x="630" y="230" text-anchor="start">The 59 × 45 mm window shows the</text>
<text class="v" x="630" y="250" text-anchor="start">57.6 × 43.2 mm picture; the glass</text>
<text class="v" x="630" y="270" text-anchor="start">touch surface sits in it.</text>
<text class="v" x="630" y="290" text-anchor="start"></text>
<text class="v" x="630" y="310" text-anchor="start">No button: everything is on the screen.</text>
<text class="v" x="630" y="330" text-anchor="start">The backlight goes off after 10 min;</text>
<text class="v" x="630" y="350" text-anchor="start">a touch wakes it, and a fault does too.</text>
</svg>
