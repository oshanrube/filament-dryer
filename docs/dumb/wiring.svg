<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="900" viewBox="0 0 1180 900" role="img"><title>Dumb dryer wiring</title><style>
text{font-family:Inter,Arial,sans-serif}
.t{font-size:18px;font-weight:600;fill:#111}.r{font-size:14px;fill:#111}.v{font-size:12px;fill:#444}.p{font-size:11px;fill:#666}
.bx{fill:#fff;stroke:#111;stroke-width:1.6}.mod{fill:#f4f8ff;stroke:#1565c0;stroke-width:1.6}.safe{fill:#fff4e5;stroke:#ef6c00;stroke-width:1.6}
</style><rect width="1180" height="900" fill="#fff"/>
<text class="t" x="30" y="36" text-anchor="start">Dumb dryer: wiring</text>
<text class="v" x="30" y="58" text-anchor="start">12 V from the shared supply. The heater only runs when the box is too humid AND below the temperature cap; near the cap the W1209 drops half the heater.</text>
<rect class="bx" x="30" y="80" width="120" height="60" rx="6"/>
<text class="r" x="90.0" y="102" text-anchor="middle">XT60 12 V in</text>
<text class="p" x="90.0" y="120" text-anchor="middle">shared supply lead</text>
<path d="M150 110 L190 110" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect x="190" y="101" width="46" height="18" rx="3" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="213" y="94" text-anchor="middle">F1 15 A</text>
<path d="M236 110 L1130 110" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text class="v" x="1130" y="100" text-anchor="end">+12 V</text>
<path d="M150 130 L170 130 L170 800 L1130 800" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text class="v" x="1130" y="820" text-anchor="end">GND</text>
<rect class="mod" x="230" y="200" width="300" height="260" rx="6"/>
<text class="r" x="380.0" y="222" text-anchor="middle">STC-3028 (DC 12 V version)</text>
<text class="p" x="380.0" y="240" text-anchor="middle">front-panel cut-out 71 × 29 mm</text>
<circle cx="250" cy="270" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="260" y="274" text-anchor="start">12V +</text>
<circle cx="250" cy="300" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="260" y="304" text-anchor="start">12V −</text>
<circle cx="250" cy="360" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="260" y="364" text-anchor="start">probe</text>
<circle cx="510" cy="290" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="500" y="294" text-anchor="end">humidity COM</text>
<circle cx="510" cy="320" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="500" y="324" text-anchor="end">humidity NO (dehumidify)</text>
<circle cx="510" cy="380" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="500" y="384" text-anchor="end">temp COM</text>
<circle cx="510" cy="410" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="500" y="414" text-anchor="end">temp NO (heat)</text>
<path d="M250 110 L250 270" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="250" cy="110" r="4.5" fill="#c62828"/>
<path d="M250 300 L185 300 L185 800" fill="none" stroke="#212121" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="185" cy="800" r="4.5" fill="#212121"/>
<path d="M250 360 L215 360 L215 535 L305 535 L305 560" fill="none" stroke="#9e9e9e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="bx" x="230" y="560" width="150" height="50" rx="6"/>
<text class="r" x="305.0" y="582" text-anchor="middle">T + RH probe</text>
<text class="p" x="305.0" y="600" text-anchor="middle">in the chamber air</text>
<path d="M560 110 L560 290 L510 290" fill="none" stroke="#c62828" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="560" cy="110" r="4.5" fill="#c62828"/>
<path d="M510 320 L620 320 L620 640 L330 640" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text class="p" x="340" y="632" text-anchor="start">DRY: on while the box is too humid</text>
<circle cx="330" cy="640" r="4.5" fill="#ef6c00"/>
<path d="M330 640 L330 690" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="bx" x="270" y="690" width="120" height="50" rx="6"/>
<text class="r" x="330.0" y="712" text-anchor="middle">blower</text>
<text class="p" x="330.0" y="730" text-anchor="middle">4010 12 V</text>
<path d="M330 740 L330 800" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="330" cy="800" r="4.5" fill="#212121"/>
<circle cx="580" cy="640" r="4.5" fill="#ef6c00"/>
<path d="M580 640 L580 380 L510 380" fill="none" stroke="#ef6c00" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M510 410 L545 410 L545 470 L760 470" fill="none" stroke="#f9a825" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<text class="p" x="560" y="492" text-anchor="start">HEAT: humid and below the cap</text>
<rect class="safe" x="760" y="445" width="120" height="50" rx="6"/>
<text class="r" x="820.0" y="467" text-anchor="middle">KSD301</text>
<text class="p" x="820.0" y="485" text-anchor="middle">85 °C, opens</text>
<path d="M880 470 L910 470" fill="none" stroke="#f9a825" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="safe" x="910" y="445" width="130" height="50" rx="6"/>
<text class="r" x="975.0" y="467" text-anchor="middle">thermal fuse</text>
<text class="p" x="975.0" y="485" text-anchor="middle">92 °C, one-shot</text>
<path d="M1040 470 L1080 470 L1080 560" fill="none" stroke="#f9a825" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1080" cy="520" r="4.5" fill="#f9a825"/>
<rect class="bx" x="1020" y="560" width="120" height="60" rx="6"/>
<text class="r" x="1080.0" y="582" text-anchor="middle">heater A</text>
<text class="p" x="1080.0" y="600" text-anchor="middle">50 W, 3 Ω</text>
<path d="M1080 620 L1080 800" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="1080" cy="800" r="4.5" fill="#212121"/>
<rect class="mod" x="780" y="200" width="220" height="170" rx="6"/>
<text class="r" x="890.0" y="222" text-anchor="middle">W1209 (stage 2)</text>
<text class="p" x="890.0" y="240" text-anchor="middle">set 5 °C under the cap</text>
<circle cx="800" cy="270" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="810" y="274" text-anchor="start">+12 V</text>
<circle cx="800" cy="295" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="810" y="299" text-anchor="start">GND</text>
<circle cx="980" cy="270" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="970" y="274" text-anchor="end">relay COM</text>
<circle cx="980" cy="300" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="970" y="304" text-anchor="end">relay NO</text>
<circle cx="980" cy="340" r="5" fill="#fff" stroke="#111" stroke-width="1.4"/>
<text class="p" x="970" y="344" text-anchor="end">NTC probe</text>
<path d="M800 110 L800 270" fill="none" stroke="#c62828" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="800" cy="110" r="4.5" fill="#c62828"/>
<path d="M800 295 L750 295 L750 800" fill="none" stroke="#212121" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="750" cy="800" r="4.5" fill="#212121"/>
<path d="M1080 520 L1110 520 L1110 270 L980 270" fill="none" stroke="#f9a825" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<path d="M980 300 L1060 300 L1060 400 L895 400 L895 650" fill="none" stroke="#8d6e63" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<rect class="bx" x="835" y="650" width="120" height="60" rx="6"/>
<text class="r" x="895.0" y="672" text-anchor="middle">heater B</text>
<text class="p" x="895.0" y="690" text-anchor="middle">50 W, 3 Ω</text>
<path d="M895 710 L895 800" fill="none" stroke="#212121" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>
<circle cx="895" cy="800" r="4.5" fill="#212121"/>
<path d="M980 340 L1020 340" fill="none" stroke="#9e9e9e" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
<text class="p" x="1024" y="344" text-anchor="start">→ next to the STC probe</text>
<text class="v" x="30" y="846" text-anchor="start">Heaters A and B: aluminium-housed 50 W resistors (RX24, 3 Ω: 48 W each at 12 V), screwed to one finned heatsink in the blower's airflow.</text>
<text class="v" x="30" y="864" text-anchor="start">The KSD301 and thermal fuse sit in the chamber air near the lid; they protect both heaters (a probe that falls out or fails cannot run away).</text>
<text class="v" x="30" y="882" text-anchor="start">Wire the heater path in 16 AWG silicone (8 A); the controllers' power in 22 AWG. All relays switch 12 V DC well inside their 10 A rating.</text>
</svg>
