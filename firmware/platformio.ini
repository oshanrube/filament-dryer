; Filament dryer firmware, PlatformIO project (same setup as the gate controller).
;
;   pio run -e dryer-1roll            build for the 1-roll board (PCB or perfboard: same pins)
;   pio run -e dryer-1roll -t upload  build and flash over USB
;   pio test -e native                run the control-logic tests on this computer
;
; See README.md for the pin map, the API and how the .bin files are made.

[platformio]
default_envs = dryer-1roll

[env:dryer-1roll]
; 6.9.0 ships Arduino core 2.0.17, the same pin as the gate controller and the version
; this firmware was built against.
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
; The 1-roll PCB uses an ESP32-C3-WROOM-02 (4 MB), the perfboard a SuperMini (4 MB): both match devkitm-1.
board_build.flash_mode = qio
board_build.partitions = default.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; native USB serial/JTAG, matched by usb id; no dtr/rts reset circuit to drive
monitor_port = hwgrep://303A:1001
monitor_dtr = 0
monitor_rts = 0
build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D DRYER_BOARD_1ROLL=1
  -Wall
lib_deps =
  bblanchon/ArduinoJson@6.21.2
  https://github.com/tzapu/WiFiManager.git#v2.0.17
  bogde/HX711@0.7.5
  paulstoffregen/OneWire@2.3.8
  milesburton/DallasTemperature@3.11.0
  olikraus/U8g2@2.35.30
  links2004/WebSockets@2.4.1

; Host build for the tests in test/: only the plain C++ control logic in lib/DryerCore.
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++17 -Wall
